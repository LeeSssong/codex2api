name: codex2api-state

services:
  codex2api:
    image: ${CODEX_IMAGE:-ghcr.io/hloolx/codex2api:latest}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CODEX_PORT:-8080}:8080"
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET:?Set ADMIN_SECRET to your admin password}
      DATABASE_DRIVER: sqlite
      DATABASE_PATH: /data/codex2api.db
      CACHE_DRIVER: memory
      CODEX_BIND: 0.0.0.0
      CODEX_PORT: "8080"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - state-data:/data
      - state-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s

volumes:
  state-data:
  state-logs:
