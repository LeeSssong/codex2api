root = "."
tmp_dir = ".dev/tmp"

[build]
cmd = "go build -o ./.dev/tmp/codex2api.exe ."
bin = ".dev/tmp/codex2api.exe"
include_ext = ["go", "mod", "sum"]
include_file = [".env"]
exclude_dir = [".git", ".dev", "frontend", "data", "logs", "vendor", "docs", "assets"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = false
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
